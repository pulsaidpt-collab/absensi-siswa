<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Sekolah</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#1d2433;--m:#6b7588;--p:#1f6feb;--b:#dde2ec;--r:#d92d20;--g:#12805c}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1b202b;--t:#e8ecf4;--m:#97a1b5;--b:#2c3445}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--c);border-bottom:1px solid var(--b)}
header span{color:var(--m)}nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--m)}nav a.on{background:var(--p);color:#fff}
main{max-width:900px;margin:16px auto;padding:0 12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer;margin:8px 6px 0 0}
button.d{background:var(--r)}button.s{background:var(--g)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b)}
.w{overflow-x:auto}.vid{position:relative;max-width:380px;margin:auto}
video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}
.vid:after{content:"";position:absolute;inset:8% 25%;border:3px dashed #fff8;border-radius:50%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;color:#fff;display:none;z-index:9}
small{color:var(--m)}.m{color:var(--r)}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='absensi_db_v1',TH=.88; // TH: ambang kemiripan wajah (naikkan = lebih ketat)
const ADMIN={u:'kepsek',p:'kepsek123',name:'Kepala Sekolah'};
let db=JSON.parse(localStorage.getItem(K)||'null')||{teachers:[],students:[],att:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const today=()=>new Date().toLocaleDateString('sv'),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let me=null,role='',tab='',stream=null,f={from:today(),to:today()};

function msg(t,bad){const e=$('#toast');e.textContent=t;e.style.background=bad?'var(--r)':'var(--g)';e.style.display='block';clearTimeout(e.h);e.h=setTimeout(()=>e.style.display='none',3500)}
async function cam(){stop();const v=$('#v');if(!v)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});v.srcObject=stream;await v.play()}catch(e){msg('Kamera tidak bisa diakses (gunakan https/localhost & izinkan kamera)',1)}}
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}

// ---- Pengenalan wajah ringan (tanpa server): vektor piksel abu-abu 24x24 dari area wajah
async function vec(){const v=$('#v');if(!v||!v.videoWidth)throw Error('Kamera belum siap');
 let x=v.videoWidth*.25,y=v.videoHeight*.1,w=v.videoWidth*.5,h=v.videoHeight*.8;
 if('FaceDetector' in window){try{const r=await new FaceDetector().detect(v);if(!r.length)throw Error('Wajah tidak terdeteksi');const b=r[0].boundingBox;x=b.x;y=b.y;w=b.width;h=b.height}catch(e){if(e.message==='Wajah tidak terdeteksi')throw e}}
 const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.drawImage(v,x,y,w,h,0,0,24,24);
 const d=g.getImageData(0,0,24,24).data;let a=[];for(let i=0;i<d.length;i+=4)a.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);
 const m=a.reduce((p,q)=>p+q)/a.length;a=a.map(q=>q-m);const n=Math.hypot(...a)||1;return a.map(q=>q/n)}
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
async function cap3(){const o=[];for(let i=0;i<3;i++){o.push(await vec());await sleep(450)}return o}
function find(list,q){const sc=list.filter(p=>p.face&&p.face.length).map(p=>({p,s:Math.max(...p.face.map(x=>dot(x,q)))})).sort((a,b)=>b.s-a.s);
 if(!sc.length||sc[0].s<TH||(sc[1]&&sc[0].s-sc[1].s<.02))return null;return sc[0].p}

// ---- Absensi (anti dobel: kunci tanggal+jenis+id)
function mark(type,p){const date=today();
 if(db.att.some(a=>a.date===date&&a.type===type&&a.id===p.id))return false;
 db.att.push({date,type,id:p.id,name:p.name,kelas:p.kelas||'-',time:new Date().toLocaleTimeString('id-ID')});save();return true}
async function scan(type){try{const q=await vec();const p=find(type==='guru'?db.teachers:db.students,q);
 if(!p)return msg('Wajah tidak dikenali / belum terdaftar',1);
 if(mark(type,p)){msg('✔ '+p.name+' tercatat hadir');render()}else msg(p.name+' sudah absen hari ini',1)}catch(e){msg(e.message,1)}}
async function enrollMe(){try{me.face=await cap3();save();msg('Wajah tersimpan');render()}catch(e){msg(e.message,1)}}
async function addMurid(){const n=$('#n').value.trim(),k=$('#k').value.trim();if(!n||!k)return msg('Isi nama & kelas',1);
 if(db.students.some(s=>s.name.toLowerCase()===n.toLowerCase()&&s.kelas.toLowerCase()===k.toLowerCase()))return msg('Murid sudah terdaftar',1);
 try{const fc=await cap3();if(find(db.students,fc[0]))return msg('Wajah ini sudah terdaftar sebagai murid lain',1);
  db.students.push({id:uid(),name:n,kelas:k,face:fc});save();msg('Murid ditambahkan');render()}catch(e){msg(e.message,1)}}
async function reMurid(id){try{db.students.find(s=>s.id===id).face=await cap3();save();msg('Wajah diperbarui');render()}catch(e){msg(e.message,1)}}
function addGuru(){const n=$('#n').value.trim(),u=$('#u').value.trim(),p=$('#p').value;if(!n||!u||!p)return msg('Lengkapi semua kolom',1);
 if(u===ADMIN.u||db.teachers.some(t=>t.user===u))return msg('Username sudah dipakai',1);
 db.teachers.push({id:uid(),name:n,user:u,pass:p,face:[]});save();msg('Guru ditambahkan');render()}
function del(kind,id){if(!confirm('Hapus data ini?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
function login(){const r=$('#r').value,u=$('#u').value.trim(),p=$('#p').value;
 if(r==='admin'&&u===ADMIN.u&&p===ADMIN.p){me=ADMIN;role='admin'}
 else if(r==='guru'){const t=db.teachers.find(t=>t.user===u&&t.pass===p);if(t){me=t;role='guru'}}
 if(!me)return msg('Username atau password salah',1);tab='';render()}

// ---- Ekspor
function dataOf(w){const rg=t=>db.att.filter(a=>a.type===t&&a.date>=f.from&&a.date<=f.to).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(w==='guru')return['Daftar Guru',['No','Nama','Username','Wajah'],db.teachers.map((t,i)=>[i+1,t.name,t.user,t.face.length?'Terdaftar':'Belum'])];
 if(w==='murid')return['Daftar Murid',['No','Nama','Kelas'],db.students.map((s,i)=>[i+1,s.name,s.kelas])];
 const t=w==='rg'?'guru':'murid';return['Absensi '+(t==='guru'?'Guru':'Murid')+' '+f.from+' sd '+f.to,['Tanggal','Jam','Nama','Kelas'],rg(t).map(a=>[a.date,a.time,a.name,a.kelas])]}
function ex(k,w){if(typeof XLSX==='undefined'||!window.jspdf)return msg('Library ekspor belum termuat (perlu internet)',1);
 const[n,h,r]=dataOf(w);if(k==='x'){const b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet([h,...r]),'Data');XLSX.writeFile(b,n+'.xlsx')}
 else{const d=new jspdf.jsPDF();d.text(n,14,15);d.autoTable({head:[h],body:r,startY:22});d.save(n+'.pdf')}}
const exBtn=w=>`<button class=s onclick="ex('x','${w}')">Unduh Excel</button><button class=s onclick="ex('p','${w}')">Unduh PDF</button>`;
const tbl=(h,r)=>`<div class=w><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length}><small>Belum ada data</small></td></tr>`}</table></div>`;
const video=()=>`<div class=vid><video id=v playsinline muted></video></div>`;
function todayList(t){const r=db.att.filter(a=>a.type===t&&a.date===today());return `<div class=card><b>Hadir hari ini (${r.length})</b>${tbl(['Jam','Nama','Kelas'],r.map(a=>[a.time,esc(a.name),esc(a.kelas)]))}</div>`}

function view(){
 if(tab==='guru')return `<div class=card><b>Tambah Guru</b><div class=row><div><label>Nama</label><input id=n></div><div><label>Username</label><input id=u></div><div><label>Password</label><input id=p></div></div><button onclick=addGuru()>Tambah</button></div>
 <div class=card><b>Daftar Guru (${db.teachers.length})</b> ${exBtn('guru')}${tbl(['Nama','Username','Wajah',''],db.teachers.map(t=>[esc(t.name),esc(t.user),t.face.length?'✔':'✘ belum',`<button class=d onclick="del('teachers','${t.id}')">Hapus</button>`]))}</div>`;
 if(tab==='murid')return `<div class=card><b>Daftar Murid (${db.students.length})</b> ${exBtn('murid')}${tbl(['Nama','Kelas',''],db.students.map(s=>[esc(s.name),esc(s.kelas),`<button class=d onclick="del('students','${s.id}')">Hapus</button>`]))}</div>`;
 if(tab==='rg'||tab==='rm'){const[n,h,r]=dataOf(tab);return `<div class=card><div class=row><div><label>Dari</label><input type=date value=${f.from} onchange="f.from=this.value;render()"></div><div><label>Sampai</label><input type=date value=${f.to} onchange="f.to=this.value;render()"></div></div>${exBtn(tab)}</div><div class=card><b>${esc(n)}</b> (${r.length})${tbl(h,r.map(x=>x.map(esc)))}</div>`}
 if(tab==='ag')return `<div class=card><b>Absensi Guru via Wajah</b><br><small>Hadapkan wajah ke kamera, lalu tekan tombol.</small>${video()}<div style="text-align:center"><button onclick="scan('guru')">Absen Sekarang</button>${me.face.length?'':'<button class=s onclick=enrollMe()>Rekam Wajah Saya (wajib sekali)</button>'}${me.face.length?'<button class=s onclick=enrollMe()>Rekam Ulang Wajah</button>':''}</div></div>${todayList('guru')}`;
 if(tab==='am')return `<div class=card><b>Absensi Murid via Wajah</b><br><small>Murid menghadap kamera, tekan tombol untuk setiap murid.</small>${video()}<div style="text-align:center"><button onclick="scan('murid')">Absen Murid</button></div></div>${todayList('murid')}`;
 if(tab==='dm')return `<div class=card><b>Tambah Murid + Rekam Wajah</b><div class=row><div><label>Nama</label><input id=n></div><div><label>Kelas</label><input id=k></div></div>${video()}<div style="text-align:center"><button onclick=addMurid()>Simpan & Rekam Wajah</button></div></div>
 <div class=card><b>Murid (${db.students.length})</b>${tbl(['Nama','Kelas','Wajah',''],db.students.map(s=>[esc(s.name),esc(s.kelas),s.face.length?'✔':'✘',`<button class=s onclick="reMurid('${s.id}')">Rekam ulang</button><button class=d onclick="del('students','${s.id}')">Hapus</button>`]))}</div>`}

function render(){stop();const A=$('#app');
 if(!me){A.innerHTML=`<div class=card style="max-width:340px;margin:10vh auto"><h2 style="margin-top:0">Absensi Sekolah</h2><label>Masuk sebagai</label><select id=r><option value=admin>Kepala Sekolah / Admin</option><option value=guru>Guru</option></select><label>Username</label><input id=u><label>Password</label><input id=p type=password onkeydown="event.key==='Enter'&&login()"><button onclick=login()>Masuk</button><p><small>Admin awal: kepsek / kepsek123</small></p></div>`;return}
 const T=role==='admin'?[['guru','Daftar Guru'],['murid','Daftar Murid'],['rg','Absensi Guru'],['rm','Absensi Murid']]:[['ag','Absen Guru'],['am','Absen Murid'],['dm','Data Murid']];
 if(!T.some(t=>t[0]===tab))tab=T[0][0];
 A.innerHTML=`<header><b>${esc(me.name)}</b><span>${role==='admin'?'Kepala Sekolah':'Guru'}</span><nav>${T.map(t=>`<a class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</a>`).join('')}<a onclick="me=null;role='';render()">Keluar</a></nav></header><main>${view()}</main>`;
 if($('#v'))cam()}
render();
</script></body></html>
